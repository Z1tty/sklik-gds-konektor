<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="logo.png">
  <title>Připravujeme – Sklik Konektor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; padding-top: 64px; }
    .hub-nav { background: #1e293b; }
    main { max-width: 880px; margin: 0 auto; }
    h1 { font-weight: 700; color: #0f172a; margin-bottom: .5rem; }
    .lead-sub { color: #64748b; margin-bottom: 2rem; }

    .upcoming-list {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-left: 4px solid #94a3b8;
      border-radius: .75rem;
      padding: .5rem 1.75rem;
    }
    .upcoming-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1.1rem 0;
    }
    .upcoming-item + .upcoming-item {
      border-top: 1px solid #f1f5f9;
    }
    .upcoming-icon {
      width: 42px;
      height: 42px;
      border-radius: .55rem;
      background: #f1f5f9;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      flex-shrink: 0;
    }
    .upcoming-content h3 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 .35rem;
    }
    .upcoming-content p {
      font-size: .9rem;
      color: #475569;
      margin: 0;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark hub-nav fixed-top shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <i class="bi bi-plug-fill me-2"></i>Sklik Konektor
    </a>
    <a href="index.html" class="btn btn-sm btn-outline-light ms-auto">
      <i class="bi bi-arrow-left me-1"></i>Rozcestník
    </a>
  </div>
</nav>

<div class="container py-4">
  <main>

    <h1><i class="bi bi-hourglass-split me-2 text-primary"></i>Připravujeme</h1>
    <p class="lead-sub">Přehled chystaných změn a kapitol dokumentace, na kterých se aktuálně pracuje.</p>

    <div class="upcoming-list">
      <div class="upcoming-item">
        <div class="upcoming-icon"><i class="bi bi-tag"></i></div>
        <div class="upcoming-content">
          <h3>Přejmenování na Sklik Google Data Studio connector</h3>
          <p>Zkráceně <strong>GDS</strong>.</p>
        </div>
      </div>
      <div class="upcoming-item">
        <div class="upcoming-icon"><i class="bi bi-patch-check"></i></div>
        <div class="upcoming-content">
          <h3>Dokončení verifikace na verzi 7.0.0</h3>
        </div>
      </div>
      <div class="upcoming-item">
        <div class="upcoming-icon"><i class="bi bi-arrow-clockwise"></i></div>
        <div class="upcoming-content">
          <h3>Refaktor aplikace</h3>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
