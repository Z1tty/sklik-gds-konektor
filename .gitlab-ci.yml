stages:
  - test
  - deploy

validate:
  stage: test
  script:
    - mkdir -p public
    - cp -r doc/. public/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp -r doc/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
